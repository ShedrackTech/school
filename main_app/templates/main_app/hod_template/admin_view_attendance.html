{% extends 'main_app/hod_template/admin_base.html' %}
{% block title %}View Attendance — EduLedger{% endblock %}
{% block breadcrumb %}Attendance{% endblock %}
{% block page_content %}
<div class="pg-hdr"><h1 class="pg-title">View Attendance</h1><p class="pg-sub">Filter and view attendance records</p></div>
<div class="card" style="max-width:720px;margin-bottom:24px" data-fetch-url="{% url 'get_admin_attendance' %}">
    <div class="card-bd">
        <div class="fr">
            <div class="fg"><label class="fl">Subject</label><select name="subject" id="subjectFilter" class="fs"><option value="">Select subject</option>{% for s in subjects %}<option value="{{ s.id }}">{{ s.subject_name }}</option>{% endfor %}</select></div>
            <div class="fg"><label class="fl">Session</label><select name="session" id="sessionFilter" class="fs"><option value="">Select session</option>{% for s in sessions %}<option value="{{ s.id }}">{{ s.session_start }} - {{ s.session_end }}</option>{% endfor %}</select></div>
        </div>
    </div>
</div>
<div id="attendanceResults"></div>
{% endblock %}
{% block extra_js %}
<script>
lucide.createIcons();
var fetchUrl=document.querySelector('[data-fetch-url]').getAttribute('data-fetch-url');
function loadAttendance(){var s=document.getElementById('subjectFilter').value,se=document.getElementById('sessionFilter').value,c=document.getElementById('attendanceResults');if(!s||!se){c.innerHTML='<div class="card"><div class="card-bd"><div class="empty"><div class="empty-ico"><i data-lucide="clipboard-check"></i></div><h3>Select filters</h3><p>Choose a subject and session</p></div></div></div>';lucide.createIcons();return}c.innerHTML='<div class="card"><div class="card-bd" style="text-align:center;padding:40px"><p style="color:var(--n400)">Loading...</p></div></div>';fetch(fetchUrl+'?subject_id='+s+'&session_id='+se).then(function(r){return r.json()}).then(function(d){if(!d||d.length===0){c.innerHTML='<div class="card"><div class="card-bd"><div class="empty"><div class="empty-ico"><i data-lucide="clipboard-check"></i></div><h3>No records found</h3></div></div></div>';lucide.createIcons();return}var h='<div class="card"><div class="card-hd"><h3 class="card-t">'+d.length+' Records</h3></div><div class="card-bd" style="padding:0"><table class="lt"><thead><tr><th>Date</th><th>Session</th></tr></thead><tbody>';d.forEach(function(r){h+='<tr><td style="font-weight:600;color:var(--n900)">'+r.attendance_date+'</td><td>'+r.session+'</td></tr>'});h+='</tbody></table></div></div>';c.innerHTML=h}).catch(function(){c.innerHTML='<div class="card"><div class="card-bd"><div class="empty"><div class="empty-ico"><i data-lucide="alert-triangle"></i></div><h3>Error loading data</h3></div></div></div>';lucide.createIcons()})}
document.getElementById('subjectFilter').addEventListener('change',loadAttendance);
document.getElementById('sessionFilter').addEventListener('change',loadAttendance);
</script>
{% endblock %}
