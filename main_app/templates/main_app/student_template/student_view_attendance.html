{% extends 'main_app/student_template/student_base.html' %}
{% block title %}My Attendance — EduLedger{% endblock %}
{% block breadcrumb %}My Attendance{% endblock %}
{% block page_content %}
<div class="pg-hdr"><h1 class="pg-title">My Attendance</h1><p class="pg-sub">View your attendance records by subject</p></div>
<div class="card" style="max-width:540px;margin-bottom:24px" data-fetch-url="{% url 'student_view_attendance' %}">
    <div class="card-bd">
        <div class="fg" style="margin-bottom:0"><label class="fl">Filter by Subject</label><select name="subject" id="subjectFilter" class="fs"><option value="">All Subjects</option>{% for s in subjects %}<option value="{{ s.id }}">{{ s.subject_name }}</option>{% endfor %}</select></div>
    </div>
</div>
<div id="attendanceResults"></div>
{% endblock %}
{% block extra_js %}
<script>
lucide.createIcons();
var fetchUrl=document.querySelector('[data-fetch-url]').getAttribute('data-fetch-url');
function loadAttendance(){var subject=document.getElementById('subjectFilter').value,c=document.getElementById('attendanceResults');var url=fetchUrl+'?ajax=1';if(subject)url+='&subject_id='+subject;c.innerHTML='<div class="card"><div class="card-bd" style="text-align:center;padding:40px"><p style="color:var(--n400)">Loading...</p></div></div>';fetch(url).then(function(r){return r.json()}).then(function(data){if(!data||data.length===0){c.innerHTML='<div class="card"><div class="card-bd"><div class="empty"><div class="empty-ico"><i data-lucide="clipboard-check"></i></div><h3>No attendance records</h3></div></div></div>';lucide.createIcons();return}var h='<div class="card"><div class="card-hd"><h3 class="card-t">'+data.length+' Records</h3></div><div class="card-bd" style="padding:0"><table class="lt"><thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead><tbody>';data.forEach(function(r){var cls=r.status?'ok':'no',label=r.status?'Present':'Absent';h+='<tr><td style="font-weight:600;color:var(--n900)">'+r.date+'</td><td>'+(r.subject||'')+'</td><td><span class="badge '+cls+'"><span class="dot"></span> '+label+'</span></td></tr>'});h+='</tbody></table></div></div>';c.innerHTML=h}).catch(function(){c.innerHTML='<div class="card"><div class="card-bd"><div class="empty"><div class="empty-ico"><i data-lucide="alert-triangle"></i></div><h3>Error</h3><p>Could not load data</p></div></div></div>';lucide.createIcons()})}
document.getElementById('subjectFilter').addEventListener('change',loadAttendance);
loadAttendance();
</script>
{% endblock %}
